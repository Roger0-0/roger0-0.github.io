<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        
        #ytplayer {
            margin: 20px 0;
        }
        
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        
        button:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>
  <h1>Roger TV</h1>
    <iframe 
        id="ytplayer"
        width="600" 
        height="400" 
        src="https://www.youtube-nocookie.com/embed/videoseries?list=PLuv8X8wVNERpAU02kHLfAs0g4X30wzpUv&autoplay=1&enablejsapi=1" 
        title="YouTube video player" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" 
        allowfullscreen>
    </iframe>
    <button onclick="playRandomVideo()">Next Channel</button>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytplayer', {
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            playRandomVideo();
        }

        function playRandomVideo() {
            if (player && player.getPlaylist) {
                var playlist = player.getPlaylist();
                var randomIndex = Math.floor(Math.random() * playlist.length);
                
                player.setShuffle(true);
                player.playVideoAt(randomIndex);
            }
        }
    </script>
</body>
</html>
